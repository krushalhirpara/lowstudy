<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="1050" cy="150" r="280" fill="#4ADE80" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="200" fill="#22C55E" opacity="0.08" filter="url(#glow)"/>

  <!-- Decorative Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header Branding & Category Badge -->
  <g transform="translate(80, 95)">
    <!-- LowStudy Logo Pill -->
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="22" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" letter-spacing="1">LOWSTUDY</text>
    
    <!-- Category Pill -->
    <rect x="155" y="0" width="220" height="34" rx="17" fill="#4ADE80" fill-opacity="0.15" stroke="#4ADE80" stroke-opacity="0.4" stroke-width="1"/>
    <text x="175" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4ADE80" letter-spacing="0.5">CRIMINAL LAW REFORMS 2023</text>
  </g>

  <!-- Article Title & Subtitle Content -->
  <g transform="translate(80, 240)">
    <!-- Subtitle / Tag -->
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4ADE80" letter-spacing="2">DIGITAL EVIDENCE • STATUTORY SCHEDULES</text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="'Merriweather', Georgia, serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">BSA 2023 vs Evidence Act</text>

    <!-- Subtitle description -->
    <text x="0" y="125" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Electronic Records Admissibility &amp; Section 63 Rules</text>
  </g>

  <!-- Bottom Badges & Verified Seal -->
  <g transform="translate(80, 500)">
    <line x1="0" y1="-25" x2="1040" y2="-25" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <text x="0" y="15" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B">Curated by LowStudy Legal Editorial Team</text>
    <text x="360" y="15" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B">•</text>
    <text x="380" y="15" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B">Syllabus Aligned &amp; Statutorily Verified</text>

    <rect x="880" y="-8" width="160" height="34" rx="10" fill="url(#accent-grad)"/>
    <text x="912" y="14" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0F172A">READ GUIDE →</text>
  </g>

  <!-- Legal Art Graphic / Silhouette on Right -->
  <g transform="translate(920, 180)" opacity="0.85">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="100" cy="100" r="70" fill="rgba(255,255,255,0.02)"/>
    <!-- Scales / Emblem Graphic -->
    <path d="M 100 45 L 100 155 M 65 65 L 135 65 M 65 65 L 45 105 L 85 105 Z M 135 65 L 115 105 L 155 105 Z M 80 155 L 120 155" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>